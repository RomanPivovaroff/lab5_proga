plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'com.example'
version = '1.0.0'

repositories {
    mavenCentral()
}

checkstyle {
    toolVersion = '10.12.5'
    ignoreFailures = true  // не падать при ошибках
    showViolations = true  // показывать нарушения

    config = resources.text.fromArchiveEntry(configurations.checkstyle[0], 'google_checks.xml')
}

spotless {
    java {
        target 'src/main/java/**/*.java'  // все Java файлы

        // Google Java Format для автоисправлений
        googleJavaFormat('1.22.0').aosp()

        // Дополнительные фиксы
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
        indentWithSpaces(2)

    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    implementation 'jakarta.activation:jakarta.activation-api:2.0.0'
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.2'
    implementation 'org.glassfish.jaxb:jaxb-core:4.0.5'
    implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.5'
}

tasks.withType(JavaCompile).configureEach {
    dependsOn spotlessApply
    options.encoding = 'UTF-8'
}

checkstyleMain.dependsOn 'spotlessApply'
checkstyleTest.dependsOn 'spotlessApply'

application {
    mainClass = 'Main'
}

run {
    standardInput = System.in
    args = ["input.xml"]
}

test {
    useJUnitPlatform()
}

shadowJar {
    archiveBaseName = 'lab5'
    archiveVersion = '1.0.0'
    manifest {
        attributes 'Main-Class': 'Main'
    }
}